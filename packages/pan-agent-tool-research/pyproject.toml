[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pan-agent-tool-research"
version = "0.1.0"
description = "Optional deterministic tool discovery plugin for PanAgent Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pan-agent-runtime>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pan_agent_tool_research"]
