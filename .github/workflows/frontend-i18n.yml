name: frontend i18n

on:
  pull_request:
    paths:
      - '.github/workflows/frontend-i18n.yml'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/scripts/check-i18n-literals.mjs'
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'frontend/packages/api/src/**/*.ts'
      - 'frontend/packages/api/src/**/*.tsx'
      - 'frontend/packages/biz-ui/src/**/*.ts'
      - 'frontend/packages/biz-ui/src/**/*.tsx'
      - 'frontend/tests/fixtures/i18n-key-checker/**'
      - 'frontend/tests/i18n/i18n-key-checker.test.ts'

concurrency:
  group: frontend-i18n-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check translation literals and keys
        run: pnpm check:i18n
