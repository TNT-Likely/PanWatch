name: Reverse proxy subpath

on:
  pull_request:
    paths:
      - '.github/workflows/reverse-proxy-subpath.yml'
      - 'requirements*.txt'
      - 'server.py'
      - 'src/bootstrap/**'
      - 'src/web/**'
      - 'src/platform/runtime/config.py'
      - 'src/modules/assistant/api.py'
      - 'src/modules/administration/api/mcp.py'
      - 'frontend/**'
      - 'tests/test_public_path.py'
      - 'tests/test_subpath_build.py'
      - 'tests/test_mcp_public_path.py'
      - 'tests/test_static_assets_security.py'
      - 'src/modules/research/analysis_link.py'
      - 'src/modules/administration/api/settings.py'
      - 'docs/reverse-proxy-subpath.md'
      - 'tests/test_analysis_link_settings.py'
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/reverse-proxy-subpath.yml'
      - 'requirements*.txt'
      - 'server.py'
      - 'src/bootstrap/**'
      - 'src/web/**'
      - 'src/platform/runtime/config.py'
      - 'src/modules/assistant/api.py'
      - 'src/modules/administration/api/mcp.py'
      - 'frontend/**'
      - 'tests/test_public_path.py'
      - 'tests/test_subpath_build.py'
      - 'tests/test_mcp_public_path.py'
      - 'tests/test_static_assets_security.py'
      - 'src/modules/research/analysis_link.py'
      - 'src/modules/administration/api/settings.py'
      - 'docs/reverse-proxy-subpath.md'
      - 'tests/test_analysis_link_settings.py'

permissions:
  contents: read

concurrency:
  group: subpath-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Frontend prefix and service-worker contracts
        working-directory: frontend
        run: pnpm run test --run tests/api/base-path.test.tsx tests/api/public-url.test.ts tests/api/service-worker-scope.test.ts tests/routing/analysis-modal-public-links.test.tsx tests/routing/markdown-fragments.test.tsx tests/routing/markdown-footnote-identity.test.tsx tests/onboarding/getting-started.test.tsx
      - name: Build the single runtime-configurable frontend
        working-directory: frontend
        run: pnpm build
      - name: ASGI, authentication, SSE and production-asset matrix
        run: python -m pytest -q tests/test_public_path.py tests/test_subpath_build.py tests/test_static_assets_security.py tests/test_mcp_public_path.py tests/test_mcp_server.py tests/test_analysis_link_settings.py
      - name: Verify minimum supported routing dependencies
        run: |
          python -m pip install 'fastapi==0.110.1' 'starlette==0.37.2'
          python -m pytest -q tests/test_public_path.py tests/test_subpath_build.py tests/test_static_assets_security.py tests/test_mcp_public_path.py tests/test_mcp_server.py tests/test_analysis_link_settings.py
