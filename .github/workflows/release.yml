name: release

on:
  push:
    tags:
      # PanWatch tags are like 0.2.3 (no "v" prefix)
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker tag to publish (e.g. 0.2.3)'
        required: true
        type: string
      push_latest:
        description: 'Also push :latest'
        required: false
        type: boolean
        default: true
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'

env:
  IMAGE_NAME: sunxiao0721/panwatch

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            push_latest="${{ inputs.push_latest }}"
            platforms="${{ inputs.platforms }}"
          else
            version="${{ github.ref_name }}"
            push_latest="true"
            platforms="linux/amd64,linux/arm64"
          fi

          version_no_v="$version"
          if [[ "$version" == v* ]]; then
            version_no_v="${version#v}"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_no_v=$version_no_v" >> "$GITHUB_OUTPUT"
          echo "push_latest=$push_latest" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - name: Validate and prepare release notes
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          current="${{ steps.vars.outputs.version }}"
          notes_version="${{ steps.vars.outputs.version_no_v }}"
          notes_file="docs/releases/${notes_version}.md"

          previous=""
          while IFS= read -r tag; do
            if [[ "$tag" != "$current" ]]; then
              previous="$tag"
              break
            fi
          done < <(git tag --list --sort=-v:refname)

          args=(
            --version "$current"
            --repository "${{ github.repository }}"
            --source "$notes_file"
            --output release-notes.md
          )
          if [[ -n "$previous" ]]; then
            args+=(--previous-tag "$previous")
          fi
          python scripts/prepare_release_notes.py "${args[@]}"

      - name: Install system libs for WeasyPrint (PDF export tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libcairo2 libcairo-gobject2 libgdk-pixbuf-2.0-0 \
            libffi-dev libfontconfig1 fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -x -q

      - name: Run marketdata package tests
        run: python -m pytest packages/marketdata/tests -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.version_no_v }},enable=${{ steps.vars.outputs.version_no_v != steps.vars.outputs.version }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=PanWatch
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.vars.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release (tag push only)
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          body_path: release-notes.md

      - name: Send Telegram notification
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.version }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          MESSAGE="📊 <b>PanWatch ${TAG} is available</b>

          📦 <code>${IMAGE_NAME}:${TAG}</code>
          📝 <a href=\"${RELEASE_URL}\">Release notes</a>"

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=true" >/dev/null
            echo "Telegram release notification sent."
          else
            echo "Telegram credentials are not configured; skipping notification."
          fi
