name: Timezone contracts

on:
  pull_request:
    paths:
      - '.github/workflows/timezones.yml'
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'frontend/**'
      - 'src/**'
      - 'packages/marketdata/**'
      - 'tests/**'
      - 'docs/timezones*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/timezones.yml'
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'frontend/**'
      - 'src/**'
      - 'packages/marketdata/**'
      - 'tests/**'

concurrency:
  group: timezones-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:timezones
      - name: Test complete alert entries, offsets, DST and display boundaries
        run: pnpm run test --run tests/timezone tests/portfolio/market-calendar.test.tsx tests/analysis/analysis-metadata.test.tsx tests/assistant/AssistantExports.test.tsx tests/assistant/AssistantSidebar.test.tsx tests/settings/independent-loading.test.tsx
        env:
          TZ: UTC

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify API contracts under different deployment clocks
        run: |
          for deployment_zone in UTC Asia/Shanghai America/New_York; do
            TZ="$deployment_zone" python -m pytest -q tests/test_timezone.py tests/test_user_timezone.py tests/test_assistant_capability_foundations.py
          done
        shell: bash --noprofile --norc -e -o pipefail {0}
