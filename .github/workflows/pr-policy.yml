name: PR contribution policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

# Serialize event and daily runs so notice timestamps and closure cannot race.
concurrency:
  group: pr-contribution-policy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

env:
  # Audit is read-only. Activation is a separate maintainer decision after rollout.
  PR_POLICY_MODE: ${{ vars.PR_POLICY_MODE || 'audit' }}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted policy only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check metadata and manage contribution notices
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { run } = require('./.github/scripts/pr-policy.cjs');
            await run({ github, context, core });
