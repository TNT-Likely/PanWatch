name: Application regression

on:
  pull_request:
    paths: ['src/**', 'server.py', 'packages/**', 'tests/**', 'frontend/**', 'requirements*.txt', 'pyproject.toml', 'Makefile', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['src/**', 'server.py', 'packages/**', 'tests/**', 'frontend/**', 'requirements*.txt', 'pyproject.toml', 'Makefile', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui && pnpm check:i18n && pnpm check:market-colors
      - run: pnpm run test --run
      - run: pnpm build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libcairo2 fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - name: Test application and all local packages
        run: |
          python -m pytest tests/ -q
          for package in packages/*; do
            if [ -d "$package/tests" ]; then python -m pytest "$package/tests" -q; fi
          done
