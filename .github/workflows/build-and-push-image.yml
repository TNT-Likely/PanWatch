# build-and-push-image.yml · PanWatch Docker 镜像构建+推送到 GHCR
#
# 触发: 推 git tag(v*.*.*)或手动 dispatch
# 产出: ghcr.io/xiaoze-hub/panwatch:latest(及对应版本号)
# 用途: 同事部署 `docker pull ghcr.io/xiaoze-hub/panwatch:latest`

name: build-and-push-image

on:
  push:
    tags:
      - 'v*.*.*'           # 推 v0.1.0 这种 tag 触发
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像 tag(留空用 latest)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write          # 推 GHCR 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.ref_name }}" ] && [ "${{ github.ref_name }}" != "main" ]; then
            # tag 触发: 去掉 v 前缀(如 v0.1.0 → 0.1.0)
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/xiaoze-hub/panwatch" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xiaoze-hub/panwatch:latest
            ghcr.io/xiaoze-hub/panwatch:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          labels: |
            org.opencontainers.image.title=PanWatch
            org.opencontainers.image.description=数智分析 · 自托管 AI 盯盘助手
            org.opencontainers.image.source=https://github.com/xiaoze-hub/PanWatch
            org.opencontainers.image.licenses=MIT
