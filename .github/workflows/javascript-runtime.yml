name: JavaScript runtime compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/javascript-runtime.yml'
      - 'src/platform/marketdata/javascript_runtime.py'
      - 'tests/test_marketdata_javascript_runtime.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  native-contexts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'ubuntu-24.04-arm']
        runtime: ['py-mini-racer==0.6.0', 'mini-racer==0.14.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated runtime dependencies
        run: python -m pip install pytest '${{ matrix.runtime }}'
      - name: Test serial warmup and concurrent native contexts
        run: python -m pytest --noconftest tests/test_marketdata_javascript_runtime.py -q
