name: Anti-spam sweep tests

on:
  pull_request:
    paths:
      - '.github/scripts/anti-spam-sweep*'
      - '.github/workflows/anti-spam*.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/anti-spam-sweep*'
      - '.github/workflows/anti-spam*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run classification tests
        run: bash .github/scripts/anti-spam-sweep.test.sh
