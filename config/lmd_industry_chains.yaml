# 老马投资研究 · AI 行情轮动分类框架
# 沿 AI 物理连接顺序投资（以 GPU 为起点），非传统产业链上中下游分层
#
# 主轮动：AI算力 → 云服务和大模型 → 软件应用 → 物理AI
# A股建议跳过「云&大模型」「软件应用」环节（美股例外）
#
# AI算力细分（轮动次序）：
#   GPU → CPO → HBM → PCB → 液冷 → 半导体&设备 → 服务器 → IDC → 电力
